name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      # Errors and warnings fail the build; the existing lint infos do not.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

  # Compiles the Kotlin side (channels, foreground service) and the plugins,
  # and keeps the installable APKs on the run's Summary page for 30 days.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      # Release builds run at full speed (debug Dart is much slower), so these
      # are the ones to measure with. Signed with the debug key: fine for
      # installing on test phones, not for a store.
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-demo-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-demo-apk-arm32-older-phones
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
